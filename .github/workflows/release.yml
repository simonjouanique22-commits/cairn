# À chaque tag vX.Y.Z : tests, extension VS Code (.vsix) et plugin JetBrains (.zip), joints à une release GitHub.
# Actions épinglées par empreinte de commit (version entre parenthèses).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # (v7.0.1)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # (v7.1.0)
        with:
          node-version: 22
      - name: Tests
        run: python3 check.py && node vscode/test.js && node web/test.js
      - name: Paquet de l'extension
        working-directory: vscode
        run: npx --yes @vscode/vsce@3 package --no-dependencies --allow-missing-repository --skip-license -o "cairn-${GITHUB_REF_NAME}.vsix"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vscode/cairn-*.vsix --title "Cairn $GITHUB_REF_NAME" --notes-file CHANGELOG.md
  jetbrains:
    needs: vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # (v7.0.1)
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # (v6.3.0)
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # (v6.4.1)
        with:
          gradle-version: '8.14.3'
      - name: Plugin JetBrains
        working-directory: jetbrains
        run: gradle buildPlugin --no-daemon
      - name: Ajout à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp jetbrains/build/distributions/*.zip "cairn-jetbrains-${GITHUB_REF_NAME}.zip"
          gh release upload "$GITHUB_REF_NAME" "cairn-jetbrains-${GITHUB_REF_NAME}.zip"
