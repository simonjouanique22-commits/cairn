# On every push: tests on Linux, macOS and Windows, and a build of the JetBrains plugin.
# Actions pinned by commit hash (version in brackets).
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # (v7.0.1)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # (v7.1.0)
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # (v7.1.0)
        with:
          python-version: '3.12'
      - name: Hooks
        run: python check.py
      - name: Extension
        run: node vscode/test.js
      - name: Universal view
        run: node web/test.js
      - name: Vim
        if: runner.os != 'Windows'
        run: vim -Nu NONE -Es -S vim/test.vim
  jetbrains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # (v7.0.1)
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # (v6.3.0)
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # (v6.4.1)
        with:
          gradle-version: '8.14.3'
      - name: JetBrains plugin
        working-directory: jetbrains
        run: gradle buildPlugin --no-daemon
